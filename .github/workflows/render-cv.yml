name: Render LaTeX CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "cv/**"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rendercv:
    name: Build PDF from cv/main.tex
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-extra biber latexmk

      - name: Build CV PDF
        run: |
          chmod +x cv/render_cv.sh
          ./cv/render_cv.sh

      - name: Upload cv.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: assets/pdf/cv.pdf

      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/cv.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "chore: render latest LaTeX CV PDF"
          git push
